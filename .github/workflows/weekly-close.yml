name: weekly-close

# 每週一 12:05 台北時間（= 04:05 UTC）結算名單並推播。
# 排 12:05 而不是 12:00，是留緩衝避免排程稍早觸發時抓不到剛截止的場次。
# 端點是冪等的，重複呼叫只會推播一次，所以 GitHub 排程延遲不影響正確性。
on:
  schedule:
    - cron: '5 4 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: '手動指定要結算的比賽日 (YYYY-MM-DD)，留空則自動判斷'
        required: false
        default: ''

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 先喚醒服務
        run: |
          curl --silent --show-error --fail \
               --retry 5 --retry-delay 20 --retry-all-errors \
               --max-time 180 \
               https://line-weekly-game-bot.onrender.com/health

      - name: 結算並推播名單
        env:
          TASK_KEY: ${{ secrets.TASK_KEY }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -z "$TASK_KEY" ]; then
            echo "::error::缺少 TASK_KEY secret"
            exit 1
          fi
          url="https://line-weekly-game-bot.onrender.com/tasks/close?key=$TASK_KEY"
          [ -n "$DATE" ] && url="$url&date=$DATE"
          # 只印出回應內容，網址含密鑰不能進 log
          curl --silent --show-error --fail --max-time 120 "$url" | tee result.json
          echo

      - name: 檢查結果
        run: |
          if grep -q '"pushed":false' result.json; then
            echo "::warning::有群組沒推播成功，請看上面的 reason（可能是額度保護觸發）"
          fi
