name: weekly-close

# 備援用。主要由 cron-job.org 在週一 12:00 準時結算。
# GitHub 排程實測曾延遲 5.5 小時（排 12:05、17:41 才跑），不能當主要排程。
# 端點是冪等的：cron-job.org 已結算過的話，這裡跑到只會回「已結算過」，不會重複推播；
# 只有 cron-job.org 失效時，這裡才會（晚一點）補送最終名單。
#
# 需要 repo variable SERVICE_URL 與 repo secret TASK_KEY。
on:
  schedule:
    - cron: '5 4 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: '手動指定要結算的比賽日 (YYYY-MM-DD)，留空則自動判斷'
        required: false
        default: ''

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_URL: ${{ vars.SERVICE_URL }}
    steps:
      - name: 檢查設定
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::缺少 repo variable SERVICE_URL"
            exit 1
          fi
          if [ -z "${{ secrets.TASK_KEY }}" ]; then
            echo "::error::缺少 repo secret TASK_KEY"
            exit 1
          fi

      - name: 先喚醒服務
        run: |
          curl --silent --show-error --fail \
               --retry 5 --retry-delay 20 --retry-all-errors \
               --max-time 180 \
               "$SERVICE_URL/health"

      - name: 結算並推播名單
        env:
          TASK_KEY: ${{ secrets.TASK_KEY }}
          DATE: ${{ inputs.date }}
        run: |
          url="$SERVICE_URL/tasks/close?key=$TASK_KEY"
          [ -n "$DATE" ] && url="$url&date=$DATE"
          # 只印出回應內容，網址含密鑰不能進 log
          curl --silent --show-error --fail --max-time 120 "$url" | tee result.json
          echo

      - name: 檢查結果
        run: |
          if grep -q '"pushed":false' result.json; then
            echo "::warning::有群組沒推播成功，請看上面的 reason（可能是額度保護觸發）"
          fi
